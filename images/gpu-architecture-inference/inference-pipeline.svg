<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="450" fill="#fafaf8"/>
<text font-weight="600" font-size="14" fill="#1a1a1a" x="340" y="20" text-anchor="middle">LLM inference pipeline</text>
<rect x="40" y="38" width="600" height="48" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#0C447C" x="340" y="56" text-anchor="middle">1. Model loading (system memory &#8594; HBM)</text>
<text font-size="10" fill="#185FA5" x="340" y="72" text-anchor="middle">Weights deserialized, quantized, sharded across GPUs</text>
<line x1="340" y1="86" x2="340" y2="100" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<rect x="180" y="102" width="320" height="36" rx="6" fill="#f0f0eb" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#444441" x="340" y="124" text-anchor="middle">2. Tokenize input (CPU-side)</text>
<line x1="340" y1="138" x2="340" y2="152" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<rect x="40" y="154" width="600" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#712B13" x="340" y="172" text-anchor="middle">3. Prefill phase (COMPUTE-BOUND)</text>
<text font-size="10" fill="#993C1D" x="340" y="188" text-anchor="middle">Process entire prompt in parallel, build KV cache</text>
<text font-size="10" fill="#993C1D" x="340" y="202" text-anchor="middle">Tensor Cores saturated, high arithmetic intensity</text>
<line x1="340" y1="214" x2="340" y2="228" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<rect x="40" y="230" width="400" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#085041" x="240" y="248" text-anchor="middle">4. Decode phase (MEMORY-BOUND)</text>
<text font-size="10" fill="#0F6E56" x="240" y="264" text-anchor="middle">Generate tokens one at a time, read full weights per token</text>
<text font-size="10" fill="#0F6E56" x="240" y="278" text-anchor="middle">Low arithmetic intensity, bandwidth-starved</text>
<rect x="470" y="230" width="170" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#633806" x="555" y="248" text-anchor="middle">KV cache (in HBM)</text>
<text font-size="10" fill="#854F0B" x="555" y="262" text-anchor="middle">Grows with context</text>
<line x1="440" y1="254" x2="468" y2="254" stroke="#888" stroke-width="0.5" stroke-dasharray="4 4"/>
<path d="M 40 260 C 20 260, 20 300, 40 300" fill="none" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<text font-size="10" fill="#555" x="54" y="310">Autoregressive loop</text>
<line x1="240" y1="290" x2="240" y2="316" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<rect x="130" y="318" width="220" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#3C3489" x="240" y="336" text-anchor="middle">5. Sample next token</text>
<text font-size="10" fill="#534AB7" x="240" y="350" text-anchor="middle">Top-k, top-p, temperature</text>
<line x1="240" y1="354" x2="240" y2="368" stroke="#888" stroke-width="1" marker-end="url(#a2)"/>
<rect x="130" y="370" width="220" height="30" rx="6" fill="#f0f0eb" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#444441" x="240" y="389" text-anchor="middle">6. Detokenize and stream</text>
<text font-size="10" fill="#555" x="480" y="330" text-anchor="start">Optimization levers:</text>
<text font-size="10" fill="#555" x="480" y="346" text-anchor="start">&#x2022; Quantization (FP16&#8594;FP8&#8594;INT4)</text>
<text font-size="10" fill="#555" x="480" y="360" text-anchor="start">&#x2022; Continuous batching</text>
<text font-size="10" fill="#555" x="480" y="374" text-anchor="start">&#x2022; PagedAttention (vLLM)</text>
<text font-size="10" fill="#555" x="480" y="388" text-anchor="start">&#x2022; FlashAttention kernels</text>
</svg>
