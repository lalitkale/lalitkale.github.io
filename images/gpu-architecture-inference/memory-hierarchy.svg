<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="440" fill="#fafaf8"/>
<text font-weight="600" font-size="14" fill="#1a1a1a" x="340" y="20" text-anchor="middle">GPU memory hierarchy</text>
<rect x="220" y="38" width="240" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="13" fill="#712B13" x="340" y="62" text-anchor="middle">Registers</text>
<text font-size="11" fill="#993C1D" x="472" y="54" text-anchor="start">~1 cycle, ~19 TB/s per SM</text>
<text font-size="11" fill="#993C1D" x="208" y="54" text-anchor="end">64K per SM</text>
<rect x="180" y="94" width="320" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text font-weight="600" font-size="13" fill="#633806" x="340" y="118" text-anchor="middle">L1 cache / shared memory</text>
<text font-size="11" fill="#854F0B" x="512" y="110" text-anchor="start">~20-30 cycles</text>
<text font-size="11" fill="#854F0B" x="168" y="110" text-anchor="end">128-228 KB</text>
<rect x="140" y="150" width="400" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="13" fill="#085041" x="340" y="174" text-anchor="middle">L2 cache (shared across all SMs)</text>
<text font-size="11" fill="#0F6E56" x="552" y="166" text-anchor="start">~150-200 cycles</text>
<text font-size="11" fill="#0F6E56" x="128" y="166" text-anchor="end">40-60 MB</text>
<rect x="100" y="206" width="480" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-weight="600" font-size="13" fill="#0C447C" x="340" y="230" text-anchor="middle">HBM (VRAM)</text>
<text font-size="11" fill="#185FA5" x="592" y="222" text-anchor="start">~400-800 cycles</text>
<text font-size="11" fill="#185FA5" x="88" y="222" text-anchor="end">80-288 GB</text>
<rect x="60" y="262" width="560" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="13" fill="#3C3489" x="340" y="286" text-anchor="middle">System memory (host DRAM via PCIe/NVLink)</text>
<text font-size="11" fill="#534AB7" x="632" y="278" text-anchor="start">~μs</text>
<line x1="340" y1="78" x2="340" y2="92" stroke="#888" stroke-width="1" marker-end="url(#a1)"/>
<line x1="340" y1="134" x2="340" y2="148" stroke="#888" stroke-width="1" marker-end="url(#a1)"/>
<line x1="340" y1="190" x2="340" y2="204" stroke="#888" stroke-width="1" marker-end="url(#a1)"/>
<line x1="340" y1="246" x2="340" y2="260" stroke="#888" stroke-width="1" marker-end="url(#a1)"/>
<text font-size="11" fill="#555" x="140" y="330" text-anchor="middle">&#8592; Larger, slower</text>
<text font-size="11" fill="#555" x="540" y="330" text-anchor="middle">Smaller, faster &#8594;</text>
<line x1="60" y1="318" x2="620" y2="318" stroke="#555" stroke-width="0.5" stroke-dasharray="4 4"/>
<rect x="140" y="350" width="400" height="44" rx="6" fill="#f0f0eb" stroke="#e5e5e0" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#1a1a1a" x="340" y="368" text-anchor="middle">The inference bottleneck</text>
<text font-size="11" fill="#555" x="340" y="384" text-anchor="middle">Model weights live in HBM; compute units starve for data</text>
</svg>
