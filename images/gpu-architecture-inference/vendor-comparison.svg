<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="system-ui, -apple-system, sans-serif">
<rect width="680" height="380" fill="#fafaf8"/>
<text font-weight="600" font-size="14" fill="#1a1a1a" x="340" y="20" text-anchor="middle">Compute unit anatomy across vendors</text>
<rect x="40" y="42" width="185" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#085041" x="133" y="59" text-anchor="middle">NVIDIA (Hopper)</text>
<rect x="248" y="42" width="185" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#712B13" x="341" y="59" text-anchor="middle">AMD (CDNA 3)</text>
<rect x="456" y="42" width="185" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="12" fill="#3C3489" x="549" y="59" text-anchor="middle">Intel (Gaudi 3)</text>
<rect x="40" y="78" width="185" height="86" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#085041" x="133" y="96" text-anchor="middle">Streaming multiprocessor</text>
<text font-size="10" fill="#0F6E56" x="133" y="112" text-anchor="middle">128 FP32 CUDA cores</text>
<text font-size="10" fill="#0F6E56" x="133" y="126" text-anchor="middle">4 Tensor Cores (4th gen)</text>
<text font-size="10" fill="#0F6E56" x="133" y="140" text-anchor="middle">Transformer engine</text>
<rect x="248" y="78" width="185" height="86" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#712B13" x="341" y="96" text-anchor="middle">Compute unit (CU)</text>
<text font-size="10" fill="#993C1D" x="341" y="112" text-anchor="middle">64 stream processors</text>
<text font-size="10" fill="#993C1D" x="341" y="126" text-anchor="middle">4 Matrix cores</text>
<text font-size="10" fill="#993C1D" x="341" y="140" text-anchor="middle">MFMA instructions</text>
<rect x="456" y="78" width="185" height="86" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#3C3489" x="549" y="96" text-anchor="middle">Tensor proc core (TPC)</text>
<text font-size="10" fill="#534AB7" x="549" y="112" text-anchor="middle">VLIW vector processor</text>
<text font-size="10" fill="#534AB7" x="549" y="126" text-anchor="middle">8 MME engines</text>
<text font-size="10" fill="#534AB7" x="549" y="140" text-anchor="middle">256-bit GEMM units</text>
<rect x="40" y="174" width="185" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#085041" x="133" y="190" text-anchor="middle">132 SMs per GPU</text>
<text font-size="10" fill="#0F6E56" x="133" y="204" text-anchor="middle">16,896 CUDA cores</text>
<rect x="248" y="174" width="185" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#712B13" x="341" y="190" text-anchor="middle">304 CUs per GPU</text>
<text font-size="10" fill="#993C1D" x="341" y="204" text-anchor="middle">19,456 stream procs</text>
<rect x="456" y="174" width="185" height="36" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#3C3489" x="549" y="190" text-anchor="middle">64 TPCs (dual-die)</text>
<text font-size="10" fill="#534AB7" x="549" y="204" text-anchor="middle">24x 200Gb Ethernet</text>
<rect x="40" y="220" width="185" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="10" fill="#085041" x="133" y="236" text-anchor="middle">80-192 GB HBM3/3e</text>
<text font-size="10" fill="#085041" x="133" y="250" text-anchor="middle">3.35-8.0 TB/s</text>
<rect x="248" y="220" width="185" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="10" fill="#712B13" x="341" y="236" text-anchor="middle">192-256 GB HBM3/3E</text>
<text font-size="10" fill="#993C1D" x="341" y="250" text-anchor="middle">5.3-6.0 TB/s</text>
<rect x="456" y="220" width="185" height="36" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="10" fill="#3C3489" x="549" y="236" text-anchor="middle">128 GB HBM2e</text>
<text font-size="10" fill="#534AB7" x="549" y="250" text-anchor="middle">3.67 TB/s</text>
<rect x="40" y="268" width="185" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#085041" x="133" y="285" text-anchor="middle">CUDA ecosystem</text>
<rect x="248" y="268" width="185" height="26" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#712B13" x="341" y="285" text-anchor="middle">ROCm / HIP</text>
<rect x="456" y="268" width="185" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-weight="600" font-size="11" fill="#3C3489" x="549" y="285" text-anchor="middle">SynapseAI / PyTorch</text>
<text font-size="10" fill="#555" x="40" y="320">* MFMA = matrix fused multiply-add. MME = matrix multiply engine. FP4 on Blackwell (B200/B300) only.</text>
</svg>
